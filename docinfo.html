<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<meta name="theme-color" content="#1E7A3C">
<style>
:root {
  --green: #1E7A3C;
  --green-dk: #14572A;
  --green-lt: #EAF4EE;
  --orange: #F26A1B;
  --orange-dk: #C2540F;
  --orange-lt: #FEF1E7;
  --ink: #1C2530;
  --muted: #5B6773;
  --line: #E2E8EC;
  --soft: #F7F9F8;
  --radius: 12px;
}

html { scroll-behavior: smooth; }
body {
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color: var(--ink);
  background: #fff;
  font-size: 16px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
#content, #header, #footer-text { max-width: 64rem; }
p, li, td, th, .paragraph { font-family: inherit; color: var(--ink); }
#content .paragraph p, #content li p { line-height: 1.65; }
a { color: var(--green); text-decoration: underline; text-decoration-color: rgba(30,122,60,.35); text-underline-offset: 3px; }
a:hover { color: var(--green-dk); text-decoration-color: var(--orange); }
strong { font-weight: 600; color: inherit; }

/* Header card */
#header {
  margin-top: 2rem;
  padding: 2.2rem 2.4rem 2rem;
  background: linear-gradient(135deg, var(--green) 0%, var(--green-dk) 100%);
  border-radius: 18px;
  border-bottom: 6px solid var(--orange);
  box-shadow: 0 12px 30px -18px rgba(20,87,42,.55);
}
#header > h1:first-child {
  font-family: inherit; color: #fff; font-weight: 800; letter-spacing: -0.02em;
  font-size: 2.6rem; line-height: 1.1; margin: 0 0 .6rem; border: 0;
}
#header .details {
  border: 0; padding: 0; margin: 0; color: #FFD9B8; font-weight: 600;
  font-size: .95rem; letter-spacing: .02em; display: flex; gap: .4rem;
}
#header .details span { color: #FFD9B8; }
#header .details br { display: none; }
#header #revnumber, #header #revremark { color: #fff; }
body.toc2 #header > h1:first-child { color: #fff; }

/* Table of contents */
#toc.toc2 {
  background: var(--soft);
  border-right: 1px solid var(--line);
  padding: 1.6rem 1.1rem 2rem 1.3rem;
}
#toc > ul { margin-left: .1rem; }
#toc #toctitle, #toc.toc2 #toctitle {
  font-family: inherit; color: var(--green); font-size: .78rem; font-weight: 700;
  text-transform: uppercase; letter-spacing: .1em; margin-bottom: .9rem;
}
#toc ul { font-family: inherit; }
#toc li { line-height: 1.35; margin: .28rem 0; }
#toc a { color: var(--ink); text-decoration: none; font-size: .9rem; display: inline-block; padding: .1rem .3rem; border-radius: 6px; }
#toc ul.sectlevel1 > li > a { font-weight: 600; }
#toc ul.sectlevel2 a { color: var(--muted); font-size: .86rem; }
#toc a:hover { color: var(--green-dk); background: var(--green-lt); }

/* Headings */
h1, h2, h3, h4, h5, h6, #toctitle, .sidebarblock > .content > .title {
  font-family: inherit; font-weight: 700; letter-spacing: -0.01em;
}
#content h2, .sect1 > h2 {
  color: var(--green); font-size: 1.85rem; margin-top: 3.2rem; padding-bottom: .5rem;
  border-bottom: 3px solid var(--orange);
}
.sect1 { padding-bottom: .4rem; }
.sect1 + .sect1 { border-top: 0; }
#content h3 { color: var(--orange-dk); font-size: 1.4rem; margin-top: 2.4rem; }
#content h4 { color: var(--green-dk); font-size: 1.08rem; margin-top: 1.7rem; }
#content h2 a, #content h3 a, #content h4 a { color: inherit; text-decoration: none; }
.sectanchor { color: var(--orange) !important; }

/* Lists */
#content ul li::marker { color: var(--orange); }
#content ol li::marker { color: var(--orange-dk); font-weight: 700; }
.ulist > ul, .olist > ol { margin-left: 1.3rem; }

/* Tables */
table.tableblock {
  border-collapse: separate; border-spacing: 0; border: 1px solid var(--line);
  border-radius: var(--radius); overflow: hidden; margin: 1rem 0 1.6rem;
  box-shadow: 0 1px 2px rgba(16,24,40,.04);
}
table.tableblock thead th, table.tableblock > thead > tr > th {
  background: var(--green); color: #fff; font-weight: 600; font-size: .9rem;
  border: 0; border-right: 1px solid rgba(255,255,255,.18); padding: .75rem .85rem; vertical-align: middle;
}
table.tableblock thead th:last-child { border-right: 0; }
table.tableblock thead th p, table.tableblock thead th .tableblock { color: #fff; }
table.tableblock td, table.tableblock th {
  border: 0; border-top: 1px solid var(--line); border-right: 1px solid var(--line);
  padding: .7rem .85rem; font-size: .93rem;
}
table.tableblock td:last-child { border-right: 0; }
table.tableblock tbody tr:nth-child(even) td { background: #FBFCFB; }
table.tableblock tbody td:first-child { background: var(--orange-lt); }
table.tableblock tbody td:first-child strong { color: var(--orange-dk); }
table.tableblock p.tableblock { margin: 0; line-height: 1.5; }
table.tableblock td .ulist { margin: 0; }
table.tableblock td .ulist > ul { margin: 0 0 0 1.05rem; }
table.tableblock td li { margin: .15rem 0; font-size: .9rem; line-height: 1.45; }
table.tableblock td .ulist ul ul { margin-left: 1rem; }
.tableblock > caption, .tableblock .title, .exampleblock > .title, .listingblock > .title { color: var(--green-dk); font-style: normal; font-weight: 600; }

/* Callouts */
.admonitionblock > table {
  border: 0; border-radius: var(--radius); background: var(--green-lt);
  border-left: 5px solid var(--green); width: 100%;
}
.admonitionblock > table td { border: 0 !important; padding: .9rem 1.1rem; background: transparent !important; }
.admonitionblock > table td.icon { width: 3rem; padding-right: 0; }
.admonitionblock > table td.content { border-left: 0; color: var(--ink); font-size: .96rem; }
.admonitionblock td.icon i::before { font-size: 1.6rem; }
.admonitionblock td.icon .icon-note::before, .admonitionblock td.icon .icon-tip::before { color: var(--green); }
.admonitionblock.note > table { background: var(--orange-lt); border-left-color: var(--orange); }
.admonitionblock.note td.icon .icon-note::before { color: var(--orange); }
.admonitionblock.important > table { background: #FFF6EE; border-left-color: var(--orange-dk); }
.admonitionblock.important td.icon .icon-important::before { color: var(--orange-dk); }
.admonitionblock td.content .ulist > ul { margin-bottom: 0; }

/* Footer */
#footer { background: var(--green-dk); border-top: 4px solid var(--orange); }
#footer-text { color: #D4E7DA; font-size: .85rem; }

/* Small screens */
@media (max-width: 767px) {
  #header { margin: 1rem; padding: 1.5rem 1.4rem; }
  #header > h1:first-child { font-size: 1.9rem; }
  #content { padding: 0 1rem; }
  table.tableblock { display: block; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.tableblock td, table.tableblock th { min-width: 9rem; }
  table.tableblock td:first-child, table.tableblock th:first-child { min-width: 7rem; }
}

@media print {
  #header { box-shadow: none; }
  table.tableblock { box-shadow: none; }
}
</style>
